# Coolify Configuration for Vonat Térkép
# This file helps Coolify understand how to deploy the application

version: '1.0'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    
    ports:
      - "3000:3000"
    
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

# Required environment variables (to be set in Coolify)
environment_variables:
  required:
    - NEXT_PUBLIC_MAPBOX_TOKEN
    - JWT_SECRET
    - NEXTAUTH_SECRET
    - REDIS_URL
  optional:
    - NEXT_PUBLIC_API_URL
    - NEXTAUTH_URL
    - SENTRY_DSN

# Required services
dependencies:
  redis:
    image: redis:7-alpine
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5